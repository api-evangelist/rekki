name: REKKI
description: >-
  REKKI is a food wholesale ordering platform that connects restaurants and chefs
  (buyers) with their suppliers. Restaurants place orders through the REKKI app,
  and suppliers receive, confirm, and fulfil them. REKKI publishes a public
  Supplier API that lets suppliers programmatically manage their product catalog
  (items, inventory, price lists), receive and confirm orders, report integration
  status back to REKKI, and manage REKKI Connect customers and their order guides.
  Authentication uses a supplier bearer token plus an X-REKKI-Authorization-Type
  header. REKKI's current product suite also includes AI agents for wholesale
  distributors (OrderAI, InboxAI, MenuAI) and a Marketplace. REKKI was surfaced as
  a portfolio company of Creandum and Point Nine.
