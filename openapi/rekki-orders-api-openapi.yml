      description: 'Notifies the buyer that the order has been acknowledged.


        Status:` 200 OK`

        Body: `{ success: true}`


        Status: `400 Conflict`

        Body: `{"error":"Order already confirmed","order_id":...}`


        Status: `400 Not Found`

        Body: `{"error":"Order not found","order_id":...}`


