        name: X-REKKI-Authorization-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - supplier_api_token
      - description: Product code of the item
        name: product_code
        in: query
        required: true
        schema:
          type: string
      - description: Unit of the item
        name: product_unit
        in: query
        required: true
        schema:
          type: string
      - description: Comma separated list of tags for the photo
        name: tags
        in: query
        schema:
          type: string
      responses:
