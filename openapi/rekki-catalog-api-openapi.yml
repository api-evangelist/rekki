openapi: 3.2.0
info:
  description: 'The base URL for all API endpoints is https://api.rekki.com/api


    Api key value consists of word Bearer together with api key that you can get from integrations@rekki.com'
  title: Rekki.com Supplier Catalog API
  contact:
    email: integrations@rekki.com
  license:
    name: All rights reserved
  version: ''
servers:
- url: https://api.rekki.com/api
tags:
- name: Catalog
paths:
  /integration/v1/catalog/items:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Lists all your catalog items. Sorted by creation date, with the oldest appearing first.

        No input parameters. Options for pagination and sorting direction may be introduced later.

        Response is a JSON object with a data property that contains catalog items of the authenticated supplier.'
      tags:
      - Catalog
      summary: Get catalog items for authenticated supplier
      operationId: GetCatalogItems
      deprecated: true
      parameters:
      - description: Required header
        name: X-REKKI-Authorization-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - supplier_api_token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.CatalogItems'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
    post:
      security:
      - ApiKeyAuth: []
      description: '### Parameters


        - **`id`**

        REKKI''s ID to uniquely identify the catalog item (for REKKI internal reference).

        If `id` is specified the item will be update, if not it will attempt to insert it.

        - **`product_code`** required

        Product code for the item that maps to the supplier''s catalog.

        Suppliers can modify the product code for future orders at https://supplier.rekki.com

        - **`name`** required

        Item name as would be defined on the customer''s product list.

        - **`currency`** optional, default is GBP

        Currency code for the price. In [ISO 4217][] three-letter format.

        - **`units_prices`** required

        List of units and their prices that the item can be ordered in.

        - **`units_prices.unit`** required

        A unit that the item can be ordered in.

        - **`units_prices.price_cents`** optional, default is 0

        The order price in cents for the item per unit.

        For example, a currency of GBP with unit 5L and price 850 means a 5L item can be ordered for £8.50.

        - **`units_prices.stock_count`** optional

        The number of items in stock for the related unit.

        - **`availability`** optional, default is "in_stock"

        Availability status of the item. Can be "in_stock" or "out_of_stock".

        - **`description`** optional

        Short description of the item.

        - **`allergens`** optional

        List of allergens for the item, if any.

        - **`allergens.type`** required when allergens is given

        Type of allergy. For example "contains peanuts" or "may contain peanuts".

        - **`allergens.symptoms`** optional

        List of symptoms for the allergy.

        - **`order_cutoff_times`** optional

        Cutt-off times are the minimum amount of time before delivery when the item can still be ordered.

        - **`order_cutoff_times.{mon,tue,wed,thu,fri,sat,sun}`** optional

        Minimum amount of time, in hours, that an item needs to be ordered in advance of delivery for the given day.

        - **`replacement_products`** optional

        List of product codes for alternative items when this item is not available.

        - **`seasonality`** optional

        List of date ranges when the item is in-season.

        - **`seasonality.start_date`** required when seasonality is given

        The start date when the item is in season. In [ISO 8601][] calendar date format `YYYY-MM-DD`.

        - **`seasonality.end_date`** required when seasonality is given

        The end date when the item is in season. In [ISO 8601][] calendar date format `YYYY-MM-DD`.'
      tags:
      - Catalog
      summary: Creates or Updates an item on your catalog.
      operationId: UpdateCatalogItem
      deprecated: true
      parameters:
      - description: Required header
        name: X-REKKI-Authorization-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - supplier_api_token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.APISupplierCatalogItem'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.GenericErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/main.APISupplierCatalogItem'
        description: Payload
        required: true
  /integration/v1/catalog/items/{id}:
    get:
      security:
      - ApiKeyAuth: []
      tags:
      - Catalog
      summary: Lists all orders placed for the supplier that were placed through REKKI
      operationId: GetCatalogItem
      deprecated: true
      parameters:
      - description: Required header
        name: X-REKKI-Authorization-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - supplier_api_token
      - description: ID of the item to retrieve. Item IDs are discoverable when listing items.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.APISupplierCatalogItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.GenericErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
    delete:
      security:
      - ApiKeyAuth: []
      description: Delete an item from your catalog by its unique ID.
      tags:
      - Catalog
      summary: Delete an item from catalog
      operationId: DeleteCatalogItem
      deprecated: true
      parameters:
      - description: Required header
        name: X-REKKI-Authorization-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - supplier_api_token
      - description: ID of the item to retrieve. Item IDs are discoverable when listing items.
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.SuccessConfirmation'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: string
  /integration/v1/catalog/replace:
    post:
      security:
      - ApiKeyAuth: []
      description: '### Parameters


        - **`id`**

